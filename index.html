<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Everyday Turkish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d6f6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turkish">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="yazitipi/yazitipi.css">
<style>
/* Düzen: üstte sabit başlık, altında kategori ızgarası / cümle listesi (tek sütun akış) */
:root{
  --bg:#f3f5f2; --kart:#ffffff; --metin:#1c2b2a; --soluk:#5f6f6c; --cizgi:#dde4e1;
  --ana:#1d6f6a; --ana-metin:#ffffff; --ana-acik:#d9eeeb; --vurgu:#9a4522; --okunus:#8a4b14; --yildiz:#a87600;
  --yazi:"Lexend",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --hedef-yazi:var(--yazi); --hedef-olcek:1; --yon:ltr;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121817; --kart:#1b2321; --metin:#e6ecea; --soluk:#9aaba7; --cizgi:#2b3633;
    --ana:#4fb3aa; --ana-metin:#0d1a18; --ana-acik:#1f3533; --vurgu:#e58a5f; --okunus:#e0a868; --yildiz:#f2c14e; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#121817; --kart:#1b2321; --metin:#e6ecea; --soluk:#9aaba7; --cizgi:#2b3633;
  --ana:#4fb3aa; --ana-metin:#0d1a18; --ana-acik:#1f3533; --vurgu:#e58a5f; --okunus:#e0a868; --yildiz:#f2c14e; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--metin);font-family:var(--yazi);font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--cizgi)}
.sar{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ust{padding-block:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#geriBtn{font-weight:600;padding:8px 12px}
.ust-araclar{display:contents}
#menuBtn{display:none}
#olcekBtn{font-weight:700;min-width:48px}
html{--olcek:1}
main,header .ust,.imza,#duyuru{zoom:var(--olcek)}
.ust h1{font-size:20px;margin:0;flex:1;min-width:200px;cursor:pointer;font-weight:700}
.ust h1 span{color:var(--ana)}
input[type=search]{flex:1;min-width:160px;max-width:320px;padding:9px 12px;border:1px solid var(--cizgi);border-radius:10px;background:var(--kart);color:var(--metin);font:inherit;font-size:16px}
button,select{font:inherit;color:var(--metin)}
button{cursor:pointer;border:1px solid var(--cizgi);background:var(--kart);border-radius:10px;padding:8px 12px}
button:hover{border-color:var(--ana)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ana);outline-offset:2px}
select{background:var(--kart);border:1px solid var(--cizgi);border-radius:8px;padding:6px 8px;min-height:44px}
button{min-height:44px}
.btn-ana{background:var(--ana);color:var(--ana-metin);border-color:var(--ana)}
main{padding-block:16px 40px}
.giris{color:var(--soluk);margin:4px 0 16px;max-width:65ch}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.kat{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.kat:hover{border-color:var(--ana)}
.kat .ik{font-size:30px}
.kat b{font-size:17px}
.kat small{color:var(--soluk)}
.geri{margin-bottom:12px}
.baslik{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.baslik .ik{font-size:36px}
.baslik h2{margin:0;font-size:24px;text-wrap:balance}
.sekmeler{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.sekmeler button.aktif{background:var(--ana);color:var(--ana-metin);border-color:var(--ana)}
.arac{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.alt{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--vurgu);font-weight:700;margin:20px 0 8px}
.satir{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.satir.caliyor{border-color:var(--ana);box-shadow:0 0 0 2px var(--ana-acik)}
.metinler{flex:1;min-width:0}
.en{font-size:calc(20px * var(--hedef-olcek));font-weight:600;direction:var(--yon);font-family:var(--hedef-yazi);line-height:1.6}
.ok{color:var(--okunus);font-style:italic;margin-top:2px}
.tr{color:var(--soluk);margin-top:2px}
.dugmeler{display:flex;gap:6px;flex-shrink:0}
.dugmeler button{width:44px;height:44px;padding:0;font-size:19px;border-radius:50%}
.dugmeler .fav.var{color:var(--yildiz);border-color:var(--yildiz)}
.kelimeler{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:8px}
.kelimeler .satir{margin:0}
.kelimeler .en{font-size:calc(18px * var(--hedef-olcek))}
.pratik{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:26px 20px;text-align:center;max-width:620px;margin:0 auto}
.pratik .sayac{color:var(--soluk);font-size:14px;font-variant-numeric:tabular-nums}
.pratik .soru{font-size:24px;font-weight:600;margin:18px 0 8px}
.pratik .ipucu{color:var(--soluk);margin-bottom:16px}
.pratik .cevap{min-height:90px}
.pratik .cevap .en{font-size:calc(24px * var(--hedef-olcek))}
.pratik .arac{justify-content:center;margin-top:16px}
.bos{color:var(--soluk);padding:20px;text-align:center}
.kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:16px 18px;margin-top:20px;max-width:700px}
.kutu h3{margin:0 0 8px;font-size:18px}
.kutu table{border-collapse:collapse;width:100%}
.kutu td{border-bottom:1px solid var(--cizgi);padding:6px 4px;vertical-align:top}
.hiz{display:flex;align-items:center;gap:6px;color:var(--soluk);font-size:14px}
.yukleniyor{color:var(--soluk);font-size:14px}
.gunun{background:var(--ana-acik);border:1px solid var(--cizgi);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center}
.gunun .etiket{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--vurgu);font-weight:700}
.wa{display:inline-flex;align-items:center;gap:8px;background:#1a7a43;color:#ffffff;border-radius:12px;padding:12px 18px;font-weight:600;text-decoration:none;font-size:18px}
.wa:hover{filter:brightness(1.08)}
.wa-mini{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#1a7a43;color:#ffffff;text-decoration:none;font-size:19px}
.baglanti{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--bg);border:1px solid var(--cizgi);border-radius:8px;padding:8px 10px;word-break:break-all;user-select:all;margin:10px 0}
.adimlar{margin:6px 0 0;padding-left:22px}
.adimlar li{margin-bottom:6px}
.kutu + .kutu{margin-top:14px}
.ilerleme{height:6px;background:var(--cizgi);border-radius:3px;overflow:hidden;margin-top:4px}
.ilerleme i{display:block;height:100%;background:var(--ana)}
.diyalog{display:flex;flex-direction:column;gap:10px;max-width:720px}
.balon{max-width:85%;border:1px solid var(--cizgi);border-radius:16px;padding:10px 14px;background:var(--kart);display:flex;gap:10px;align-items:flex-start}
.balon.B{align-self:flex-end;background:var(--ana-acik)}
.balon .kim{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--vurgu)}
.balon .en{font-size:calc(18px * var(--hedef-olcek))}
.en[dir="rtl"],.kalip-metin[dir="rtl"]{line-height:1.95}
.balon.caliyor{border-color:var(--ana);box-shadow:0 0 0 2px var(--ana-acik)}
.balon.sirasende{border:2px dashed var(--vurgu)}
.balon.sirasende .en,.balon.sirasende .ok{visibility:hidden}
.balon button{width:44px;height:44px;padding:0;border-radius:50%;flex-shrink:0}
.sirasende-not{color:var(--vurgu);font-weight:600;font-size:14px}
.mikrofon{margin-top:14px;min-height:24px}
.mikrofon .sonuc{margin-top:8px;font-size:15px}
.mikrofon .sonuc b{color:var(--ana)}
.kelime-yanlis{color:var(--vurgu);text-decoration:underline}
.notlar ul{margin:0;padding-left:20px;padding-right:0}
.notlar li{margin-bottom:6px}
.kalip{margin-top:18px}
.kalip-bas{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:4px}
.kalip-metin{font-size:calc(19px * var(--hedef-olcek));font-weight:700;color:var(--ana);direction:var(--yon);font-family:var(--hedef-yazi)}
.kalip-aciklama{color:var(--soluk);margin:2px 0 8px;max-width:65ch}
.grup-baslik{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--vurgu);font-weight:700;margin:22px 0 10px}
.duyuru{margin-top:14px;border-color:var(--ana);background:var(--ana-acik)}
.ist-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px;margin-top:12px}
.ist-kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ist-kart b{font-size:24px;color:var(--ana);font-variant-numeric:tabular-nums}
.ist-kart small{color:var(--soluk)}
.ist-grafik{display:flex;align-items:flex-end;gap:8px;height:150px;background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:12px 12px 8px}
.ist-sutun{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.ist-sutun i{display:block;width:70%;min-height:2px;background:var(--ana);border-radius:4px 4px 0 0}
.ist-sutun small,.ist-deger{font-size:12px;color:var(--soluk);font-variant-numeric:tabular-nums}
.ist-satir{background:var(--kart);border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between}
.ist-satir .ilerleme{flex-basis:100%}
.ist-rapor{white-space:pre-wrap;font-family:inherit;background:var(--bg);border:1px solid var(--cizgi);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.seviye{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--ana-acik);color:var(--ana);vertical-align:middle;letter-spacing:.03em}
.hedef{margin:8px 0 0;color:var(--soluk);max-width:65ch}
.tekrar-kart{display:block;width:100%;text-align:left;margin:0 0 14px;padding:14px 16px;border:2px solid var(--ana);background:var(--ana-acik);border-radius:14px;font-size:17px}
.kipler{justify-content:center}
.kipler button.aktif{background:var(--ana);color:var(--ana-metin);border-color:var(--ana)}
.secenekler{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.secenek{text-align:left;padding:12px 14px;font-size:17px}
.secenek.dogru{border:2px solid #1a7a43;background:#e3f4e9;color:#14532d}
.secenek.yanlis{border:2px solid var(--vurgu);text-decoration:line-through}
.ipucu-metin{opacity:.85;letter-spacing:.04em}
.bildim-arac{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
@media (max-width:560px){
  .en{font-size:calc(18px * var(--hedef-olcek))}
  .satir{align-items:flex-start}
  .dugmeler{flex-direction:column}
  .ust h1{font-size:18px;min-width:0}
  #menuBtn{display:inline-block}
  .ust-araclar{display:none;flex-basis:100%;flex-wrap:wrap;gap:8px}
  .ust-araclar.acik{display:flex}
  .ust-araclar input[type=search]{flex-basis:100%;max-width:none}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} }
/* Hazırlayanın imzası: kanat; Ş ve O kanatların içinde, zemin renginde (sayfa sonunda, küçük ve sessiz) */
.imza{display:flex;justify-content:center;padding:28px 0 calc(24px + env(safe-area-inset-bottom,0px));opacity:.9}
.imza svg{width:76px;height:auto;color:var(--ana)}
</style>

</head>
<body>
<header>
  <div class="sar ust">
    <button id="geriBtn" type="button" aria-label="Back" hidden>← Back</button>
    <h1 id="logo" role="link" tabindex="0">🇹🇷 Everyday <span>Turkish</span></h1>
    <button id="olcekBtn" type="button" aria-label="Text size" title="Text size">Aa</button>
    <button id="menuBtn" type="button" aria-expanded="false" aria-controls="ustAraclar">☰ Menu</button>
    <div class="ust-araclar" id="ustAraclar">
    <input type="search" id="ara" placeholder="Search phrases…" aria-label="Search phrases">
    <button id="favBtn">★ My favourites</button>
    <button id="ilerlemeBtn">📊 My progress</button>
    <button id="rehberBtn">Pronunciation guide</button>
    <button id="paylasBtn" class="btn-ana">📤 Share</button>
    </div>
  </div>
</header>
<main class="sar" id="icerik"></main>
<footer class="imza"><svg viewBox="0 18 96 58" role="img" aria-label="ŞO"><path fill="currentColor" d="M6 50 C16 28 34 22 48 44 C62 22 80 28 90 50 C76 42 62 46 48 60 C34 46 20 42 6 50 Z"/><path fill="currentColor" opacity=".55" d="M14 56 C24 50 36 52 48 64 C60 52 72 50 82 56 C70 56 58 62 48 72 C38 62 26 56 14 56 Z"/><g fill="var(--bg)" font-family="Georgia,serif" font-size="8.5" text-anchor="middle" opacity=".9"><text x="31" y="44">Ş</text><text x="65" y="44">O</text></g></svg></footer>

<script src="veri.js"></script>
<script>
const DIL = {"ad": "Turkish", "kod": "tr-TR", "a": "Ahmet", "b": "Zeynep", "site": "https://dilprogramlari.github.io/everyday-turkish/", "waMetni": "Everyday Turkish: ready-to-use Turkish phrases, dialogues and patterns for daily life in Türkiye, with English meaning, easy pronunciation and audio. Free, opens on your phone:", "tarih": "2026-11-18", "yon": "ltr", "sesOnbellek": "turkce-ses", "onek": "turkce", "yenilikler": ["🔁 Spaced review: a 'Phrases due for review today' button on the home screen; phrases you know come back after longer gaps.", "🎧 New practice modes: Listen and choose, Word quiz; take a 💡 hint while speaking.", "📶 Every topic now shows its level (A1/A2) and goal.", "Aa button for bigger text; a simpler menu on phones.", "✔️ Phrases and pronunciation corrected after an expert review.", "⚡ Updates now download only changed audio; offline setup resumes where it stopped."]};
const V = window.VERI || [];
window.SES = window.SES || {};
const $ = s => document.querySelector(s);
// Kayıtlar her programın kendi adıyla tutulur: aynı adreste (ör. GitHub Pages) birden çok program olsa da karışmaz.
const ONEK = (DIL.onek || 'dil') + ':';
const kaydet = (k,v)=>{try{localStorage.setItem(ONEK+k,JSON.stringify(v))}catch(e){}};
const oku = (k,d)=>{try{let r=localStorage.getItem(ONEK+k);
  // eski (öneksiz) kaydı bir kez taşı — yalnızca programın tek başına durduğu adreslerde
  if(r===null && !/github\.io$/.test(location.hostname)){ r=localStorage.getItem(k); if(r!==null) localStorage.setItem(ONEK+k,r); }
  const x=JSON.parse(r);return x==null?d:x}catch(e){return d}};
let favoriler = new Set(oku('favoriler',[]));
let hiz = oku('hiz',1);
const ses = new Audio();
let siraliOynat = null;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Sesler her kategori için ayrı bir dosyada (ses/<kategori>.js) durur; gerektiğinde yüklenir.
const sesYukleme = {};
const sesDosya = ad => 'ses/' + ((window.SESDOSYA||{})[ad] || (ad+'.js'));
const yukluPaketler = [];  // hafızada en fazla 6 paket tutulur
function sesHazirla(katId){
  if(window.SES[katId]) return Promise.resolve();
  if(!sesYukleme[katId]) sesYukleme[katId] = new Promise(r=>{
    const s=document.createElement('script'); s.src=sesDosya(katId);
    s.onload=()=>{ yukluPaketler.push(katId);
      while(yukluPaketler.length>6){ const eski=yukluPaketler.shift(); delete window.SES[eski]; delete sesYukleme[eski]; }
      r(); };
    s.onerror=()=>{delete sesYukleme[katId]; r();}; document.head.appendChild(s);
  });
  return sesYukleme[katId];
}

function cal(o, yavas){ durdurSira(); return calTek(o, yavas); }
async function calTek(o, yavas){
  const el = document.querySelector(`[data-ses="${o.ses}"]`);
  document.querySelectorAll('.caliyor').forEach(e=>e.classList.remove('caliyor'));
  if(el) el.classList.add('caliyor');
  // seçilen ses: kadın (varsayılan) ya da erkek; diyalog satırlarında ses rolden gelir
  const erkek = sesTur==='erkek' && o.sesE;
  const paketAd = erkek ? o.kat.id+'-e' : o.kat.id;
  await sesHazirla(paketAd);
  let veri = (window.SES[paketAd]||{})[erkek ? o.sesE : o.ses];
  if(!veri && erkek){ await sesHazirla(o.kat.id); veri = (window.SES[o.kat.id]||{})[o.ses]; }
  await new Promise(bitti=>{
    const son = ()=>{ if(el) el.classList.remove('caliyor'); bitti(); };
    if(!veri) return konus(o.en, yavas).then(son);
    ses.onended = ()=>{ istEkle('sure', null, (ses.duration||0)/(ses.playbackRate||1)); son(); }; ses.onerror = ()=>konus(o.en, yavas).then(son);
    istEkle('dinle', o.kat.id); if(!IST.d) IST.d={}; IST.d[o.ses]=1;
    ses.src = 'data:audio/mpeg;base64,' + veri;
    ses.preservesPitch = true;
    ses.playbackRate = yavas ? 0.7 : hiz;
    const p = ses.play(); if(p) p.catch(e=>{ if(e && e.name==='AbortError') return son(); konus(o.en, yavas).then(son); });
  });
}
// Ses yüklenemezse cihazın kendi sesi (hedef dilde) kullanılır
function konus(metin, yavas){
  return new Promise(r=>{
    if(!('speechSynthesis' in window)) return r();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(metin); u.lang=DIL.kod; u.rate = yavas?0.7:hiz;
    u.onend=r; u.onerror=r; speechSynthesis.speak(u);
  });
}
function durdurSira(){ if(siraliOynat){siraliOynat.dur=true; siraliOynat=null;} ses.pause(); }
async function hepsiniCal(btn){
  const liste = window.aktifListe || [];
  if(siraliOynat){ durdurSira(); btn.textContent='▶ Play all in order'; return; }
  const durum = siraliOynat = {dur:false}; btn.textContent='■ Stop';
  for(const o of liste){
    if(durum.dur) break;
    const el = document.querySelector(`[data-ses="${o.ses}"]`);
    if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
    await calTek(o,false);
    if(durum.dur) break;
    await new Promise(r=>setTimeout(r,1600)); // tekrar etmeniz için kısa ara
  }
  if(siraliOynat===durum) siraliOynat=null;
  btn.textContent='▶ Play all in order';
}
function favDegis(id, btn){
  favoriler.has(id)?favoriler.delete(id):favoriler.add(id);
  kaydet('favoriler',[...favoriler]); btn.classList.toggle('var', favoriler.has(id)); btn.setAttribute('aria-pressed', favoriler.has(id));
}

const tumOgeler = {};
V.forEach(k=>['cumleler','kelimeler'].forEach(l=>k[l].forEach(o=>{ if(o.ses){ o.kat=k; if(!tumOgeler[o.ses]) tumOgeler[o.ses]=o; } })));
V.forEach(k=>{ if(k.ogren) (k.ogren.kaliplar||[]).forEach(kl=>kl.ornekler.forEach(o=>{ o.kat=k; if(!tumOgeler[o.ses]) tumOgeler[o.ses]=o; })); });
const diyalogOgeleri = {};
V.forEach(k=>{ if(k.diyalog) k.diyalog.satirlar.forEach((o,i)=>{ o.kat=k; o.no=i; diyalogOgeleri[k.id+'-'+i]=o; }); });

// "Bildim" işaretleri (yalnızca bu cihazda saklanır)
let bildim = new Set(oku('bildim',[]));
function bildimDegis(id, deger){ deger?bildim.add(id):bildim.delete(id); kaydet('bildim',[...bildim]); }
const katCumleleri = k=>k.cumleler.filter(o=>o.en);

const rehberHTML = `<div class="kutu"><h3>How to read the pronunciation</h3>
<p>Turkish is written exactly as it sounds, and every letter has one sound. The grey 🗣 line is a respelling for English speakers: read it like English, then <b>listen to the audio and copy it</b>. Syllables are separated by hyphens.</p>
<table>
<tr><td><b>c</b></td><td>"j" as in <i>jam</i>: <i>cami</i> (mosque) → jah-mee</td></tr>
<tr><td><b>ç</b></td><td>"ch" as in <i>chair</i>: <i>çay</i> (tea) → chai</td></tr>
<tr><td><b>ş</b></td><td>"sh" as in <i>ship</i>: <i>şeker</i> (sugar) → sheh-ker</td></tr>
<tr><td><b>ğ</b></td><td>"soft g": never pronounced as g. It makes the vowel before it longer; between e/i it sounds like a light y: <i>dağ</i> → dah, <i>değil</i> → deh-yeel</td></tr>
<tr><td><b>ı</b></td><td>dotless i: a short "uh", like the <i>a</i> in <i>about</i>: <i>kapı</i> (door) → kah-puh</td></tr>
<tr><td><b>i</b></td><td>"ee" as in <i>see</i> (short): <i>bir</i> (one) → beer</td></tr>
<tr><td><b>ö</b></td><td>like German ö / French <i>eu</i>: say "e" with rounded lips. Written <b>ur</b> (no r sound!): <i>göz</i> → gurz; before y it is written <b>uh</b>: <i>söyle</i> → suhy-leh</td></tr>
<tr><td><b>ü</b></td><td>like German ü / French <i>u</i>: say "ee" with rounded lips. Written <b>ew</b>: <i>gül</i> → gewl</td></tr>
<tr><td><b>a / e / o / u</b></td><td>short, pure vowels: a = "ah", e = "e/eh", o = "o/oh", u = "oo"</td></tr>
<tr><td><b>r</b></td><td>a light tap of the tongue, always pronounced; at the end of a word it is soft: <i>bir</i>, <i>var</i></td></tr>
<tr><td><b>hh</b></td><td>an h you can hear, also at the end of a word: <i>sabah</i> → sah-bahh, <i>Allah</i> → ahl-lahh</td></tr><tr><td><b>CAPITALS</b></td><td>Stress is light and usually on the last syllable (not marked). When it falls elsewhere, that syllable is in CAPITALS: <i>MER-hah-bah, LEWT-fen, NEH-reh-deh, ees-TAHN-bool, ahn-LAH-mah-duhm</i> (before the negative -ma/-me), <i>geh-lee-YOH-room</i> (-iyor)</td></tr><tr><td><b>g / j / v</b></td><td>g is always hard as in <i>go</i>; j is "zh" as in <i>measure</i>; v is a soft v (almost w)</td></tr>
</table></div>
<div class="kutu"><h3>Vowel harmony</h3>
<p>Turkish endings change their vowel to match the last vowel of the word. You don't need to calculate it — just listen and you will feel it:</p>
<table>
<tr><td><b>-lar / -ler</b></td><td>plural: <i>kitap → kitaplar</i> (books), <i>ev → evler</i> (houses)</td></tr>
<tr><td><b>-da / -de</b></td><td>in / at: <i>okulda</i> (at school), <i>evde</i> (at home)</td></tr>
<tr><td><b>mı / mi / mu / mü</b></td><td>question word: <i>var mı?</i>, <i>iyi mi?</i>, <i>doğru mu?</i>, <i>güzel mi?</i></td></tr>
</table>
<p style="margin-bottom:0">Stress is light and usually falls on the last syllable; where it falls elsewhere, that syllable is written in CAPITALS (see the pronunciation table). Questions with <i>mı/mi</i> rise just before the question word.</p></div>
<div class="kutu"><h3>Three tips</h3><ol class="adimlar">
<li>Listen first (🔊), then use 🐢 slow audio and repeat aloud.</li>
<li>Learn whole phrases, not single words — Turkish puts many meanings into one word.</li>
<li>Use the 🎯 Practise tab and the 🎤 microphone check every day for five minutes.</li></ol></div>`;

function gununCumlesi(){
  const hepsi = V.flatMap(k=>k.cumleler.filter(o=>o.en));
  const d = new Date(); const gun = Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
  return hepsi[(gun*7919) % hepsi.length];
}

// Erkek sesi seçilince bütün erkek ses paketlerini arka planda indir (internetsiz kullanım için saklanır)
// Ses paketlerini tek tek, tekrar deneyerek bu cihaza kaydeder; gerçek ilerlemeyi gösterir.
let indirmeSurüyor = false, indirMetni = '';
function indirDurumYaz(m){ indirMetni = m; const e=document.getElementById('sesDurum'); if(e) e.textContent=m; cevrimdisiGoster(); }
async function sesleriIndir(erkek){
  if(!('serviceWorker' in navigator) || !navigator.serviceWorker.controller || !('caches' in window)) return false;
  const adlar = V.map(k=>erkek ? k.id+'-e' : k.id);
  const c = await caches.open(DIL.sesOnbellek);
  let hazir = 0; const eksik = [];
  for(const ad of adlar){ if(await c.match(sesDosya(ad), {ignoreSearch:true})) hazir++; else eksik.push(ad); }
  const etiket = erkek ? 'Male voice audio' : 'Audio';
  for(const ad of eksik){
    indirDurumYaz('⏳ '+etiket+' saving to this device: '+hazir+'/'+adlar.length);
    let tamam=false;
    for(let deneme=0; deneme<3 && !tamam; deneme++){
      try{ const y = await fetch(sesDosya(ad)); tamam = y.ok; }catch(e){ await new Promise(r=>setTimeout(r,1500*(deneme+1))); }
    }
    if(tamam) hazir++;
  }
  if(hazir===adlar.length){ indirDurumYaz('✅ '+etiket+' ready for offline use.'); return true; }
  indirDurumYaz('⚠️ '+etiket+' could not be fully saved ('+hazir+'/'+adlar.length+'). It will continue when you are back online.');
  return false;
}
async function sesHazirlikSirasi(){
  if(indirmeSurüyor) return; indirmeSurüyor = true;
  try{
    const kadin = await sesleriIndir(false);
    cevrimdisiHazir = kadin ? true : false;
    if(sesTur==='erkek') await sesleriIndir(true);
  } finally { indirmeSurüyor = false; cevrimdisiGoster(); }
}
window.addEventListener('online', ()=>setTimeout(sesHazirlikSirasi, 1000));
const erkekIndir = ()=>sesHazirlikSirasi();
function hizSecici(){
  return sesSecici() + `<label class="hiz" for="hizSec">Speed</label><select id="hizSec">
    ${[[0.8,'Slow'],[1,'Normal'],[1.15,'Fast']].map(([v,a])=>`<option value="${v}" ${v==hiz?'selected':''}>${a}</option>`).join('')}
  </select>`;
}
const dinleArac = ()=>`<div class="arac"><button class="btn-ana" data-hepsi>▶ Play all in order</button>${hizSecici()}</div>`;

function katSayfa(id, sekme){
  const k = V.find(x=>x.id===id); if(!k) return anaSayfa();
  sesHazirla(id); // sesi önceden indirmeye başla
  let govde = '';
  if(sekme==='cumleler'){
    window.aktifListe = k.cumleler.filter(o=>o.en);
    govde = dinleArac() + k.cumleler.map(o=>o.baslik?`<div class="alt">${esc(o.baslik)}</div>`:satir(o)).join('');
  } else if(sekme==='kelimeler'){
    window.aktifListe = k.kelimeler;
    govde = dinleArac() + `<div class="kelimeler">${k.kelimeler.map(satir).join('')}</div>`;
  } else if(sekme==='ogren' && k.ogren){
    window.aktifListe = (k.ogren.kaliplar||[]).flatMap(kl=>kl.ornekler);
    govde = ogrenHTML(k);
  } else if(sekme==='diyalog' && k.diyalog){
    govde = diyalogHTML(k);
  } else govde = `<div id="pratik"></div>`;
  $('#icerik').innerHTML = `
    <button class="geri" data-git="">← Topics</button>
    <div class="baslik"><span class="ik">${k.ikon}</span><div><h2>${esc(k.ad)}${k.seviye?` <span class="seviye">${esc(k.seviye)}</span>`:''}</h2><div class="tr">${esc(k.aciklama)}</div></div></div>
    ${k.hedef?`<p class="hedef">🎯 ${esc(k.hedef)}</p>`:''}
    <div class="sekmeler" role="tablist">
      ${[...(k.ogren?[['ogren','📘 Learn','-ogren']]:[]),['cumleler','💬 Phrases',''],['kelimeler','📖 Words','-kelimeler'],...(k.diyalog?[['diyalog','🗨️ Dialogue','-diyalog']]:[]),['pratik','🎯 Practise','-pratik']].map(([s,a,ek])=>
        `<button role="tab" aria-selected="${s===sekme}" class="${s===sekme?'aktif':''}" data-git="${id}${ek}">${a}</button>`).join('')}
    </div>${govde}`;
  if(sekme==='pratik') pratikBaslat(k.cumleler.filter(o=>o.en), k);
}

// ---------- İlerleme: yalnızca bu cihazda tutulur ----------
const bugun = (d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let IST = oku('ist', null) || {gun:{}, kat:{}, d:{}};
function istEkle(alan, katId, miktar=1){
  const g = IST.gun[bugun()] || (IST.gun[bugun()] = {dinle:0,sure:0,pratik:0,mik:0,mikPuan:0,diyalog:0});
  g[alan] = (g[alan]||0) + miktar;
  if(katId){ const k = IST.kat[katId] || (IST.kat[katId] = {dinle:0,pratik:0,diyalog:0,mik:0}); if(alan in k) k[alan] += miktar; }
  kaydet('ist', IST);
}
function istOzet(){
  const gunler = Object.keys(IST.gun).sort(); let t = {dinle:0,sure:0,pratik:0,mik:0,mikPuan:0,diyalog:0};
  gunler.forEach(g=>Object.keys(t).forEach(a=>t[a]+=IST.gun[g][a]||0));
  // art arda çalışılan gün (bugün ya da dün biten seri)
  let seri=0, d=new Date(); if(!IST.gun[bugun(d)]) d.setDate(d.getDate()-1);
  while(IST.gun[bugun(d)]){ seri++; d.setDate(d.getDate()-1); }
  const toplamCumle = V.reduce((a,k)=>a+katCumleleri(k).length,0);
  const ogrenilen = V.reduce((a,k)=>a+katBilinen(k),0);
  return {...t, gunSayisi:gunler.length, seri, toplamCumle, ogrenilen, farkli:Object.keys(IST.d||{}).length,
    dakika:Math.round(t.sure/60), ort: t.mik? Math.round(t.mikPuan/t.mik):0};
}
function raporMetni(){
  const o = istOzet();
  const enCok = Object.entries(IST.kat).sort((a,b)=>(b[1].dinle+b[1].pratik)-(a[1].dinle+a[1].pratik)).slice(0,3)
    .map(([id])=>(V.find(k=>k.id===id)||{}).ad).filter(Boolean);
  return `📊 ${document.title} — My progress report (${tarihYaz(bugun())})
📅 Days studied: ${o.gunSayisi} (streak: ${o.seri} days)
🔊 Listenme: ${o.dinle} kez, ${o.dakika} dakika
✓ Phrases learned: ${o.ogrenilen} / ${o.toplamCumle}
🎯 Practice: ${o.pratik} · 🎤 Microphone: ${o.mik} tries, average ${o.ort}%
${enCok.length?'⭐ Most studied topics: '+enCok.join(', '):''}`.trim();
}
function ilerlemeSayfa(){

  const son7 = [...Array(7)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-6+i); const g=IST.gun[bugun(d)]||{};

  const enFazla = Math.max(1, ...son7.map(x=>x.dk));
  const kart = (deger, ad)=>`<div class="ist-kart"><b>${deger}</b><small>${ad}</small></div>`;
  $('#icerik').innerHTML = `<button class="geri" data-git="">← Topics</button>
    <div class="baslik"><span class="ik">📊</span><div><h2>My progress</h2><div class="tr">This is stored only on this device.</div></div></div>
    ${o.gunSayisi? `
    <div class="ist-izgara">
      ${kart(o.gunSayisi,'<span>days studied</span>')}${kart(o.seri,'<span>day streak</span>')}
      ${kart(o.dakika,'<span>minutes listened</span>')}${kart(o.dinle,'<span>times listened</span>')}
      ${kart(o.ogrenilen+' / '+o.toplamCumle,'<span>phrases learned</span>')}${kart(o.pratik,'<span>practice</span>')}
      ${kart(o.mik,'<span>microphone tries</span>')}${kart('%'+o.ort,'<span>average accuracy</span>')}
    </div>
    <div class="alt">Last 7 days (minutes)</div>
    <div class="ist-grafik">${son7.map(x=>`<div class="ist-sutun"><span class="ist-deger">${x.dk}</span><i style="height:${Math.round(100*x.dk/enFazla)}%"></i><small>${esc(x.ad)}</small></div>`).join('')}</div>
    <div class="alt">By topic</div>
    ${V.filter(k=>IST.kat[k.id]||katBilinen(k)).map(k=>{ const s=IST.kat[k.id]||{dinle:0,pratik:0}; const yz=Math.round(100*katBilinen(k)/Math.max(1,katCumleleri(k).length));
      return `<div class="ist-satir"><span>${k.ikon} ${esc(k.ad)}</span><span class="tr">✓ ${katBilinen(k)}/${katCumleleri(k).length} · 🔊 ${s.dinle} · 🎯 ${s.pratik}</span><div class="ilerleme"><i style="width:${yz}%"></i></div></div>`; }).join('')}
    <div class="kutu"><h3>Send it to your teacher or family</h3>
      <pre class="ist-rapor">${esc(raporMetni())}</pre>
      <a class="wa" href="https://wa.me/?text=${encodeURIComponent(raporMetni())}" target="_blank" rel="noopener">💬 Raporumu Send on WhatsApp</a>
      ${navigator.share?`<p style="margin:10px 0 0"><button id="raporPaylas">📱 Share with other apps</button></p>`:''}
    </div>
    <p style="margin-top:18px"><button id="istSifirla">🗑 Reset progress</button> <span id="sifirlaOnay"></span></p>`
    : `<p class="bos">Nothing recorded yet. Open a topic and start listening; your progress will appear here.</p>`}`;
  const rp=document.getElementById('raporPaylas'); if(rp) rp.addEventListener('click', ()=>navigator.share({title:document.title, text:raporMetni()}).catch(()=>{}));
  const sf=document.getElementById('istSifirla'); if(sf) sf.addEventListener('click', ()=>{
    document.getElementById('sifirlaOnay').innerHTML = `<span class="tr">Are you sure? All progress records will be deleted.</span> <button id="sifirlaEvet">Yes, delete</button> <button id="sifirlaVazgec">Cancel</button>`;
    document.getElementById('sifirlaEvet').addEventListener('click', ()=>{ IST={gun:{},kat:{},d:{}}; kaydet('ist',IST); bildim=new Set(); kaydet('bildim',[]); ilerlemeSayfa(); });
    document.getElementById('sifirlaVazgec').addEventListener('click', ()=>{ document.getElementById('sifirlaOnay').innerHTML=''; });
  });
}

// ---------- Öğren: kalıplar ve dil notları ----------

async function diyalogOynat(btn){
  if(siraliOynat){ durdurSira(); btn.textContent='▶ Play dialogue'; document.querySelectorAll('.sirasende').forEach(e=>e.classList.remove('sirasende')); return; }
  const k = window.aktifDiyalog; const durum = siraliOynat = {dur:false}; btn.textContent='■ Stop'; istEkle('diyalog', k.id);
  for(const o of k.diyalog.satirlar){
    if(durum.dur) break;
    const el = document.querySelector(`[data-satir="${o.no}"]`);
    if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
    if(rol && o.rol===rol && el){
      el.classList.add('sirasende');
      const not = document.createElement('div'); not.className='sirasende-not'; not.textContent='🎙 Your turn — say it in '+DIL.ad+'…';
      el.querySelector('.metinler').prepend(not);
      await new Promise(r=>setTimeout(r, 2500 + o.en.length*90));
      not.remove(); el.classList.remove('sirasende');
      if(durum.dur) break;
    }
    await calTek(o,false);
    if(durum.dur) break;
    await new Promise(r=>setTimeout(r,700));
  }
  if(siraliOynat===durum) siraliOynat=null;
  btn.textContent='▶ Play dialogue';
}

// ---------- Mikrofonla kontrol ----------
// Arapça harekeleri, elif çeşitlerini ve büyük-küçük harfi eşitler
function normal(s){ return String(s).toLocaleLowerCase(DIL.kod).replace(/[\u064B-\u065F\u0670\u0640]/g,'')
  .replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[’`]/g,"'"); }
const TanimaSinifi = window.SpeechRecognition || window.webkitSpeechRecognition;
const sadele = s => normal(s).replace(/[^\p{L}\p{N}' ]/gu,' ').split(/\s+/).filter(Boolean);
function karsilastir(hedef, duyulan){
  const h = sadele(hedef), d = sadele(duyulan); const kalan=[...d]; let dogru=0;
  const isaretli = h.map(w=>{ const i=kalan.indexOf(w); if(i>=0){kalan.splice(i,1);dogru++;return esc(w);} return `<span class="kelime-yanlis">${esc(w)}</span>`; });
  return {oran: h.length?Math.round(100*dogru/h.length):0, isaretli: isaretli.join(' ')};
}
function dinleVeKontrolEt(o){
  const yer = $('#mikSonuc'); if(!yer) return;
  if(!TanimaSinifi){ yer.innerHTML='This browser does not support speech recognition. Try Chrome on Android or Safari on iPhone.'; return; }
  durdurSira();
  const t = new TanimaSinifi(); t.lang=DIL.kod; t.interimResults=false; t.maxAlternatives=3;
  yer.innerHTML='🎙 Listening… Say the phrase in '+DIL.ad+'.';
  t.onresult = e=>{
    const secenekler=[...e.results[0]].map(a=>a.transcript);
    let en=null; secenekler.forEach(s=>{ const r=karsilastir(o.en,s); if(!en||r.oran>en.oran) en={...r,s}; });
    istEkle('mik', o.kat.id); istEkle('mikPuan', null, en.oran);
    const yorum = en.oran>=90?'Excellent! 🎉':en.oran>=70?'Very good — say it a little more clearly. 👍':'Try again: listen first and copy it. 🔁';
    yer.innerHTML = `<div class="sonuc"><b>${en.oran}%</b> correct · ${yorum}<br><span class="tr">I heard: “${esc(en.s)}”</span><br>${en.isaretli}</div>`;
  };
  t.onerror = e=>{ yer.innerHTML = e.error==='not-allowed'||e.error==='service-not-allowed'
      ? 'Microphone permission was denied. Allow microphone access for this site in your browser settings.'
      : 'I couldn’t hear you. Please try again a little louder.'; };
  try{ t.start(); }catch(e){ yer.textContent='The microphone could not be started.'; }
}

// ---------- Aralıklı tekrar (Leitner kutuları) ----------
// "Bildim" denen cümle 1, 3, 7, 14, 30 gün sonra yeniden sorulur; "Tekrar çalışayım" denen ertesi gün gelir.
const ARALIK = [1,1,3,7,14,30];
let TEKRAR = oku('tekrar', {});
function gunEkle(n){ const d=new Date(); d.setDate(d.getDate()+n); return bugun(d); }
function tekrarIsle(id, bildi){
  const kutu = (TEKRAR[id]||[0])[0];
  const yeni = bildi ? Math.min(kutu+1, ARALIK.length-1) : 0;
  TEKRAR[id] = [yeni, gunEkle(bildi ? ARALIK[yeni] : 1)];
  kaydet('tekrar', TEKRAR);
}
function vadesiGelenler(){ const b=bugun(); return Object.keys(TEKRAR).filter(id=>TEKRAR[id][1]<=b && tumOgeler[id]).map(id=>tumOgeler[id]); }
function tekrarSayfa(){
  $('#icerik').innerHTML = `<button class="geri" data-git="">← Topics</button>
    <div class="baslik"><span class="ik">🔁</span><div><h2>Today’s review</h2><div class="tr">Review the phrases that are due; the ones you know come back after longer gaps.</div></div></div>
    <div id="pratik"></div>`;
  const l = vadesiGelenler();
  if(!l.length){ $('#pratik').innerHTML='<p class="bos">🎉 Today’s review is done. Check again tomorrow.</p>'; return; }
  pratikBaslat(l, null, true);
}

// ---------- Pratik: söyle, dinle-seç, kelime testi ----------
let P = null;
const karistir = a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function pratikBaslat(liste, kat, tekrarKipi){
  // önce henüz "bildim" denmeyenler gelir
  P = {liste:[...karistir(liste.filter(o=>!bildim.has(o.ses))), ...karistir(liste.filter(o=>bildim.has(o.ses)))],
       i:0, acik:false, kat:kat||null, tekrar:!!tekrarKipi, mod:'soyle', dogru:0, toplam:0, secim:null, secenek:null};
  pratikCiz();
}
function kipDegis(m){
  const k = P.kat; if(!k) return;
  P.mod = m; P.i = 0; P.acik = false; P.dogru = 0; P.toplam = 0; P.secim = null; P.secenek = null;
  P.liste = karistir(m==='kelime' ? [...k.kelimeler] : katCumleleri(k));
  pratikCiz();
}
function secenekleriKur(o, havuz, n){
  const digerleri = karistir(havuz.filter(x=>x.tr!==o.tr)).slice(0, n-1);
  return karistir([o, ...digerleri]);
}
function kipCubugu(){
  if(!P.kat || P.tekrar) return '';
  const b = (m,a)=>`<button class="${P.mod===m?'aktif':''}" data-mod="${m}" aria-pressed="${P.mod===m}">${a}</button>`;
  return `<div class="sekmeler kipler">${b('soyle','🗣 Say it')}${b('dinle','🎧 Listen and choose')}${b('kelime','📖 Word quiz')}</div>`;
}
function pratikCiz(){
  if(!P.liste.length){ $('#pratik').innerHTML = kipCubugu()+'<p class="bos">🎉 Done!</p>'; return; }
  if(P.mod==='dinle' || P.mod==='kelime') return secmeliCiz();
  const o = P.liste[P.i];
  const bilinen = P.liste.filter(x=>bildim.has(x.ses)).length;
  $('#pratik').innerHTML = kipCubugu() + `<div class="pratik">
    <div class="sayac">${P.i+1} / ${P.liste.length} · ✓ ${bilinen} learned${P.tekrar?' · '+esc(o.kat.ikon+' '+o.kat.ad):''}</div>
    <div class="soru">${esc(o.tr)}</div>
    <div class="ipucu">How do you say this in ${DIL.ad}? Say it out loud first, then take a hint or show the answer.</div>
    <div class="cevap">${P.acik?`<div class="en" lang="${DIL.kod}" dir="${DIL.yon||'ltr'}">${esc(o.en)}</div><div class="ok">🗣 ${esc(o.ok)}</div>`
      : (P.ipucu?`<div class="en ipucu-metin" lang="${DIL.kod}" dir="${DIL.yon||'ltr'}">${esc(ipucuMetni(o.en, P.ipucu))}</div>`:'')}</div>
    <div class="arac">
      <button data-p="-1">← Previous</button>
      ${P.acik?`<button data-cal="${o.ses}">🔊 Listen</button><button data-yavas="${o.ses}">🐢 Slow</button>`
              :`${(P.ipucu||0)<2?`<button data-ipucu>💡 Hint</button>`:''}<button class="btn-ana" data-goster>Show answer</button>`}
      <button data-p="1">Next →</button>
    </div>
    ${TanimaSinifi?`<div class="mikrofon">${navigator.onLine?`<button data-mik>🎤 Say it, I'll check</button>`:`<span class="tr">🎤 The microphone check needs internet.</span>`}<div id="mikSonuc" aria-live="polite"></div><p class="tr" style="font-size:13px;margin:6px 0 0">Speech recognition needs internet; your voice is sent to your phone’s recognition service.</p></div>`:''}
    ${P.acik?`<div class="bildim-arac">
      <button class="${bildim.has(o.ses)?'btn-ana':''}" data-bildim="1">✓ I knew it</button>
      <button data-bildim="0">🔁 Practise again</button></div>`:''}
    </div>`;
}
// kademeli ipucu: 1) kelimelerin ilk harfleri, 2) ilk yarısı açık
function ipucuMetni(metin, seviye){
  const k = metin.split(' ');
  if(seviye===1) return k.map(w=>w.charAt(0)+'·'.repeat(Math.max(0,[...w].length-1))).join(' ');
  const yari = Math.ceil(k.length/2);
  return k.map((w,i)=> i<yari ? w : '_'.repeat(Math.min(6,[...w].length))).join(' ');
}
function secmeliCiz(){
  const o = P.liste[P.i];
  const havuz = P.mod==='kelime' ? P.kat.kelimeler : katCumleleri(P.kat);
  if(!P.secenek) P.secenek = secenekleriKur(o, havuz, P.mod==='kelime'?4:3);
  const cevaplandi = P.secim!==null;
  $('#pratik').innerHTML = kipCubugu() + `<div class="pratik">
    <div class="sayac">${P.i+1} / ${P.liste.length} · ✓ ${P.dogru} / ${P.toplam} correct</div>
    ${P.mod==='dinle'
      ? `<div class="soru">🎧 Listen: what was said?</div><div class="arac"><button class="btn-ana" data-cal="${o.ses}">🔊 Listen</button><button data-yavas="${o.ses}">🐢 Slow</button></div>
         ${cevaplandi?`<div class="en" lang="${DIL.kod}" dir="${DIL.yon||'ltr'}">${esc(o.en)}</div><div class="ok">🗣 ${esc(o.ok)}</div>`:''}`
      : `<div class="soru"><span class="en" lang="${DIL.kod}" dir="${DIL.yon||'ltr'}">${esc(o.en)}</span></div><div class="ok">🗣 ${esc(o.ok)}</div>
         <div class="arac"><button data-cal="${o.ses}">🔊 Listen</button></div>`}
    <div class="secenekler">${P.secenek.map((x,i)=>{
      let c=''; if(cevaplandi){ if(x===o) c='dogru'; else if(i===P.secim) c='yanlis'; }
      return `<button class="secenek ${c}" data-sec="${i}" ${cevaplandi?'disabled':''}>${esc(x.tr)}</button>`; }).join('')}</div>
    <div id="secSonuc" aria-live="polite" class="tr">${cevaplandi?(P.secenek[P.secim]===o?'✅ Correct!':'❌ The right answer is in green.'):''}</div>
    <div class="arac" style="justify-content:center"><button data-p="1">Next →</button></div>
  </div>`;
  if(P.mod==='dinle' && !cevaplandi && !P.calindi){ P.calindi=true; cal(o); }
}

function aramaSayfa(q){
  const gb=document.getElementById('geriBtn'); if(gb) gb.hidden=false;
  const n = s=>normal(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const a = n(q);
  const liste = Object.values(tumOgeler).filter(o=>n(o.en).includes(a)||n(o.tr).includes(a));
  window.aktifListe = liste;
  $('#icerik').innerHTML = `<button class="geri" data-git="">← Topics</button>
    <p class="giris">${liste.length} results for "${esc(q)}"</p>` +

}

// Adresler: #yol (cümleler), #yol-kelimeler, #yol-pratik, #favori, #rehber
let icAdim = 0; // uygulama içinde açılan sayfa sayısı (geri tuşu için)
function git(h){
  durdurSira(); $('#ara').value=''; $('#ustAraclar').classList.remove('acik'); $('#menuBtn').setAttribute('aria-expanded', false);
  if(location.hash.slice(1)===h) ciz(); else { icAdim++; location.hash = h; }
  window.scrollTo(0,0);
}
function ciz(){
  const h = decodeURIComponent(location.hash.slice(1));
  const gb = document.getElementById('geriBtn'); if(gb) gb.hidden = !h && !$('#ara').value.trim();
  if(!h) return anaSayfa();
  if(h==='favori') return favoriSayfa();
  if(h==='ilerleme') return ilerlemeSayfa();
  if(h==='tekrar') return tekrarSayfa();
  if(h==='rehber') return rehberSayfa();
  if(h==='paylas') return paylasSayfa();
  const m = h.match(/^([a-z]+)(?:-(kelimeler|pratik|diyalog|ogren))?$/);
  if(!m) return anaSayfa();
  katSayfa(m[1], m[2]||'cumleler');
}
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.id==='logo') return;
  if(b.dataset.git!==undefined) return git(b.dataset.git);
  if(b.dataset.cal) return cal(tumOgeler[b.dataset.cal]);
  if(b.dataset.yavas) return cal(tumOgeler[b.dataset.yavas], true);
  if(b.dataset.fav) return favDegis(b.dataset.fav, b);
  if(b.dataset.hepsi!==undefined) return hepsiniCal(b);
  if(b.dataset.p){ P.i=(P.i+(+b.dataset.p)+P.liste.length)%P.liste.length; P.acik=false; P.ipucu=0; P.secim=null; P.secenek=null; P.calindi=false; return pratikCiz(); }
  if(b.dataset.goster!==undefined){ P.acik=true; istEkle('pratik', P.liste[P.i].kat.id); pratikCiz(); return cal(P.liste[P.i]); }
  if(b.dataset.mik!==undefined) return dinleVeKontrolEt(P.liste[P.i]);
  if(b.dataset.bildim){ const o=P.liste[P.i]; const bildi=b.dataset.bildim==='1'; bildimDegis(o.ses, bildi); tekrarIsle(o.ses, bildi);
    if(P.tekrar){ P.liste.splice(P.i,1); if(!P.liste.length){ $('#pratik').innerHTML='<p class="bos">🎉 Today’s review is done. Check again tomorrow.</p>'; return; } P.i%=P.liste.length; }
    else P.i=(P.i+1)%P.liste.length;
    P.acik=false; P.ipucu=0; return pratikCiz(); }
  if(b.dataset.ipucu!==undefined){ P.ipucu=(P.ipucu||0)+1; return pratikCiz(); }
  if(b.dataset.mod) return kipDegis(b.dataset.mod);
  if(b.dataset.sec!==undefined && P && P.secim===null){ P.secim=+b.dataset.sec; P.toplam++; const o=P.liste[P.i];
    if(P.secenek[P.secim]===o){ P.dogru++; bildimDegis(o.ses, true); tekrarIsle(o.ses, true); } else tekrarIsle(o.ses, false);
    istEkle('pratik', P.kat? P.kat.id : null); return secmeliCiz(); }
  if(b.dataset.dcal) return cal(diyalogOgeleri[b.dataset.dcal]);
  if(b.dataset.diyalogOynat!==undefined) return diyalogOynat(b);
});

let cevrimdisiHazir = null; // null: desteklenmiyor, false: hazırlanıyor, true: hazır
function cevrimdisiMetin(){
  if(cevrimdisiHazir===null) return '';
  if(indirMetni) return indirMetni;
  if(cevrimdisiHazir===true) return '✅ Ready to use offline on this device.';
  return '⏳ Saving the audio to this device; please wait a few seconds.';
}
function cevrimdisiGoster(){ const e=document.getElementById('cevrimdisiDurum'); if(e) e.textContent=cevrimdisiMetin(); }
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost') &&document.querySelector('link[rel="manifest"]')){
  cevrimdisiHazir = false;
  // yeni sürüm yayınlanınca sayfayı bir kez kendiliğinden yenile
  // Yeni sürüm gelince sayfa yenilenir; ses çalarken beklenir, sonra "güncellendi" duyurusu gösterilir.
  const eskiDenetleyici = !!navigator.serviceWorker.controller; let yenilendi = false, bekleyenYenileme = false;
  const yenile = ()=>{ if(yenilendi) return;
    if(siraliOynat || !ses.paused){ bekleyenYenileme = true; return; }
    yenilendi = true; kaydet('guncellendi', DIL.tarih || '1'); location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(eskiDenetleyici) yenile(); });
  setInterval(()=>{ if(bekleyenYenileme) yenile(); }, 2000);
  navigator.serviceWorker.register('sw.js').then(r=>{
    swKayit = r;
    // açıkken yarım saatte bir ve uygulama öne her geldiğinde yeni sürüm ara
    setInterval(()=>r.update().catch(()=>{}), 30*60*1000);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') r.update().catch(()=>{}); });
  }).catch(()=>{cevrimdisiHazir=null;cevrimdisiGoster();});
  navigator.serviceWorker.ready.then(()=>{
    // telefon yer darlığında bile kayıtları silmesin diye kalıcı depolama iste
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    const basla = ()=>setTimeout(sesHazirlikSirasi, 800);
    if(navigator.serviceWorker.controller) basla(); else navigator.serviceWorker.addEventListener('controllerchange', basla, {once:true});
  });
}
